let state={page:'home',query:'',city:'الرياض',category:'',min:'',max:'',sort:'newest',selected:1,saved:[],photoIndex:0,messages:[],draft:{title:'',category:'أجهزة',price:'',priceStatus:'fixed',city:'',description:'',photos:[]},step:1,reviewed:false,published:false};let feedback='';let errors={};
function options(values,selected){return values.map(([v,t])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${t}</option>`).join('')}
function say(t){feedback=t;let el=$('feedback');if(el)el.innerHTML=toast();else render();}
function toast(){return feedback?`<div class="toast" role="status"><span>${icon('check')}${esc(feedback)}</span><button aria-label="إغلاق التنبيه" onclick="feedback='';render()">×</button></div>`:''}

function resetSession(){state.query='';state.city='الرياض';state.category='';state.min='';state.max='';state.sort='newest';state.saved=[];state.messages=[];state.draft={title:'',category:'أجهزة',price:'',priceStatus:'fixed',city:'',description:'',photos:[]};state.step=1;state.published=false;state.reviewed=false;go('home');say('تم بدء جلسة جديدة ومسح بيانات التجربة.')}
function resultItems(){let query=state.query.toLowerCase();let a=listings.filter(x=>(!state.city||x.city===state.city)&&(!state.category||x.category===state.category)&&(!state.min||x.price>=+state.min)&&(!state.max||x.price<=+state.max)&&(!query||(/لابتوب|لاب توب|حاسب|laptop/.test(query)?x.id<=3:x.title.toLowerCase().includes(query))));if(state.sort==='asc')a.sort((a,b)=>a.price-b.price);if(state.sort==='desc')a.sort((a,b)=>b.price-a.price);return a}
function searchbar(prefix='main'){return `<form class="searchbar" onsubmit="event.preventDefault();search('${prefix}')"><div class="querybox">${icon('search')}<label class="sr" for="${prefix}-query">البحث عن منتج</label><input id="${prefix}-query" value="${esc(state.query)}" placeholder="ابحث عن سيارة، جهاز أو عقار"></div><div class="citybox">${icon('pin')}<label class="sr" for="${prefix}-city">مدينة البحث</label><select id="${prefix}-city">${options([['','كل المدن'],['الرياض','الرياض'],['جدة','جدة'],['الدمام','الدمام']],state.city)}</select></div><button class="primary">${icon('search')} بحث</button></form>`}
function search(prefix){state.query=$(prefix+'-query').value.trim();state.city=$(prefix+'-city').value;if(/لابتوب|لاب توب|حاسب|laptop/i.test(state.query))state.category='أجهزة';go('results')}
function openListing(id){state.selected=id;state.photoIndex=0;go('detail')}
function homeCard(x){return `<article class="home-card"><button onclick="openListing(${x.id})"><img src="assets/${x.image}.jpg" alt="صورة توضيحية ${esc(x.title)}"><div class="body"><div>${esc(x.title)}</div><div class="price">${x.price.toLocaleString('en-US')} ر.س</div><p class="place">${icon('pin')}${esc(x.city)}</p></div></button></article>`}
function home(){const cats=[['سيارات','car'],['أجهزة','laptop'],['عقارات','home'],['أثاث','sofa'],['خدمات','tools'],['جميع الأقسام','grid']];return `<section class="hero"><h2>ابحث عن فرصتك القادمة</h2><p>آلاف الإعلانات يوميًا في مكان واحد</p><label class="search-label" for="main-query">ماذا تبحث عنه؟</label>${searchbar()}</section><section id="categories" class="categories" aria-label="تصفح الأقسام">${cats.map(([name,i])=>`<button class="cat ${i==='sofa'?'furniture':''}" onclick="state.category='${name==='جميع الأقسام'?'':name}';state.query='';go('results')">${icon(i)}<span>${name}</span></button>`).join('')}</section><div class="section-title"><h2>أحدث الإعلانات</h2><button class="link-button" onclick="state.query='';state.category='';go('results')">عرض جميع الإعلانات ←</button></div><section class="home-grid">${[4,1,5,6,7,8].map(id=>homeCard(listings.find(x=>x.id===id))).join('')}</section><div id="feedback">${toast()}</div>`}
function filterPanel(){return `<aside class="filter-panel"><h2>${icon('grid')} تصفية النتائج</h2><form onsubmit="event.preventDefault();applyFilters()"><div class="filter-body"><div class="field"><label for="category">القسم</label><select id="category">${options([['','جميع الأقسام'],['أجهزة','أجهزة'],['سيارات','سيارات'],['عقارات','عقارات'],['أثاث','أثاث'],['خدمات','خدمات']],state.category)}</select></div><div class="field"><label for="city">المدينة</label><select id="city">${options([['','كل المدن'],['الرياض','الرياض'],['جدة','جدة'],['الدمام','الدمام']],state.city)}</select></div><div class="price-fields"><div class="field"><label for="min">السعر الأدنى بالريال</label><input id="min" type="number" min="0" value="${esc(state.min)}" placeholder="0"></div><div class="field"><label for="max">السعر الأعلى بالريال</label><input id="max" type="number" min="0" value="${esc(state.max)}" placeholder="3000"></div></div></div><p class="errors" id="filter-error" role="alert"></p><div class="buttons"><button class="primary">تطبيق</button><button class="quiet" type="button" onclick="clearFilters()">مسح</button></div></form></aside>`}
function applyFilters(){let min=$('min').value,max=$('max').value;if(min&&max&&+min>+max){$('filter-error').textContent='السعر الأدنى يجب ألا يتجاوز السعر الأعلى.';return}state.category=$('category').value;state.city=$('city').value;state.min=min;state.max=max;go('results');say('تم تحديث النتائج حسب الفلاتر المحددة.')}
function clearFilters(){state.category='';state.city='';state.min='';state.max='';go('results')}
function removeFilter(k){state[k]='';go('results')}
function listingRow(x){return `<article class="listing"><button class="open" onclick="openListing(${x.id})">عرض التفاصيل<span class="sr"> ${esc(x.title)}</span></button><div class="info"><h3>${esc(x.title)}</h3><div class="price">${x.price.toLocaleString('en-US')} ر.س</div><div class="meta"><span>${icon('pin')}${esc(x.city)}</span><span>${icon('car')}${esc(x.condition)}</span></div></div><img src="assets/${x.image}.jpg" alt="صورة توضيحية ${esc(x.title)}"></article>`}
function results(){let a=resultItems();return `<div class="results-page">${filterPanel()}<section class="result-content">${searchbar('results')}<div class="result-toolbar"><strong>${a.length} نتائج مطابقة</strong><div class="chips">${[['category',state.category],['city',state.city],['min',state.min?'من '+state.min+' ر.س':''],['max',state.max?'حتى '+state.max+' ر.س':'']].filter(x=>x[1]).map(([k,v])=>`<button class="chip" onclick="removeFilter('${k}')">${esc(v)} ×</button>`).join('')}</div><label class="sr" for="sort">ترتيب النتائج</label><select id="sort" class="sort" onchange="state.sort=this.value;render()">${options([['newest','الأحدث'],['asc','السعر من الأقل للأعلى'],['desc','السعر من الأعلى للأقل']],state.sort)}</select></div><div id="feedback">${toast()}</div><div class="result-list">${a.length?a.map(listingRow).join(''):'<section class="empty"><h2>لا توجد إعلانات مطابقة</h2><p>جرّب تغيير البحث أو إزالة بعض الفلاتر.</p><button onclick="clearFilters()">مسح الفلاتر</button></section>'}</div></section></div>`}
function details(){let x=listings.find(x=>x.id===state.selected);return `<div class="breadcrumb"><span>الرئيسية</span>‹<span>${esc(x.category)}</span>‹<span>${x.id<=3?'لابتوبات':'تفاصيل الإعلان'}</span></div><div id="feedback">${toast()}</div><section class="detail-grid"><aside class="seller-card"><h3>معلومات البائع</h3><div class="avatar">${icon('user')}</div><strong>أحمد</strong><p class="small">حساب بائع تجريبي</p><button onclick="say('ملف بائع تجريبي؛ لا توجد بيانات اتصال حقيقية.')">${icon('user')} عرض الملف الشخصي</button></aside><div class="detail-info"><h2>${esc(x.title)}</h2><div class="price">${x.price.toLocaleString('en-US')} ر.س</div><p>${icon('car')} الحالة: ${esc(x.condition)}</p><p>${icon('pin')} الموقع: ${esc(x.city)}</p><p class="description">${esc(x.description)}</p><button class="primary" onclick="go('contact')">${icon('chat')} تواصل مع البائع</button><button class="quiet" aria-pressed="${state.saved.includes(x.id)}" onclick="toggleSave()">${icon('heart')}${state.saved.includes(x.id)?'إزالة من المفضلة':'حفظ الإعلان'}</button><button class="quiet" onclick="go('results')">${icon('back')} العودة للنتائج</button></div><div class="gallery"><div class="photo-wrap"><img class="main-photo" src="assets/${x.photos[state.photoIndex]}.jpg" alt="صورة ${esc(x.title)}"><button class="photo-arrow prev" aria-label="الصورة السابقة" onclick="changePhoto(-1)">‹</button><button class="photo-arrow next" aria-label="الصورة التالية" onclick="changePhoto(1)">›</button></div><div class="thumbs">${x.photos.map((p,i)=>`<button aria-label="عرض الصورة ${i+1}" class="${state.photoIndex===i?'selected':''}" onclick="state.photoIndex=${i};render()"><img src="assets/${p}.jpg" alt=""></button>`).join('')}</div></div></section>`}
function changePhoto(n){let x=listings.find(x=>x.id===state.selected);state.photoIndex=(state.photoIndex+n+x.photos.length)%x.photos.length;render()}
function toggleSave(){let i=state.saved.indexOf(state.selected);if(i<0)state.saved.push(state.selected);else state.saved.splice(i,1);feedback=i<0?'تم حفظ الإعلان في المفضلة':'تمت إزالة الإعلان من المفضلة';render()}
function saved(){let a=listings.filter(x=>state.saved.includes(x.id));return `<div class="section-title"><h2>المفضلة</h2></div>${a.length?`<div class="result-list">${a.map(listingRow).join('')}</div>`:'<section class="empty"><h2>لا توجد إعلانات محفوظة</h2><p>احفظ إعلانًا من صفحة التفاصيل لتجده هنا.</p><button class="primary" onclick="go(\'home\')">تصفح الإعلانات</button></section>'}`}
function contact(){let x=listings.find(x=>x.id===state.selected);return `<section class="message-panel"><h2>تواصل مع البائع</h2><p>${esc(x.title)} — ${x.price.toLocaleString('en-US')} ر.س</p><p class="small">محادثة تجريبية فقط، لا تُرسل إلى بائع حقيقي.</p><div id="feedback">${toast()}</div>${state.messages.filter(m=>m.id===x.id).map(m=>`<div class="bubble">${esc(m.text)}<div class="small">تم الإرسال داخل النموذج فقط</div></div>`).join('')}<form onsubmit="event.preventDefault();sendMessage()"><label class="field-label" for="message">رسالتك</label><textarea id="message" oninput="this.setCustomValidity('')" required placeholder="هل الجهاز متوفر؟"></textarea><button class="primary">إرسال الرسالة</button><button type="button" onclick="go('detail')">العودة للإعلان</button></form></section>`}
function sendMessage(){let text=$('message').value.trim();if(!text){$('message').setCustomValidity('اكتب رسالتك أولًا.');$('message').reportValidity();return}state.messages.push({id:state.selected,text});feedback='تم إرسال الرسالة التجريبية داخل النموذج فقط.';render()}
function messages(){return `<section class="message-panel"><h2>الرسائل</h2>${state.messages.length?state.messages.map(m=>`<div class="bubble"><strong>${esc(listings.find(x=>x.id===m.id).title)}</strong><p>${esc(m.text)}</p><button onclick="state.selected=${m.id};go('contact')">فتح المحادثة</button></div>`).join(''):'<p>لا توجد رسائل بعد. افتح إعلانًا واختر التواصل مع البائع.</p>'}</section>`}
function startCreate(){state.step=1;state.published=false;go('create')}
function draftField(name,val){state.draft[name]=val;state.reviewed=false;state.published=false}
function pullDraft(){for(let [id,key]of[['adtitle','title'],['adcategory','category'],['adprice','price'],['adcity','city'],['addesc','description']])if($(id))state.draft[key]=$(id).value;return state.draft}
function errorText(k){return errors[k]?`<p class="errors">${esc(errors[k])}</p>`:''}
function detailsFields(){let d=state.draft;return `<div class="field ${errors.title?'invalid':''}"><label for="adtitle">عنوان الإعلان</label><input id="adtitle" value="${esc(d.title)}" placeholder="مثال: Dell XPS 13" oninput="draftField('title',this.value)" aria-invalid="${!!errors.title}">${errorText('title')}</div><div class="form-row"><div class="field"><label for="adcategory">القسم</label><select id="adcategory" onchange="draftField('category',this.value)">${options([['أجهزة','أجهزة'],['سيارات','سيارات'],['أثاث','أثاث'],['عقارات','عقارات']],d.category)}</select></div><div class="field ${errors.city?'invalid':''}"><label for="adcity">المدينة</label><select id="adcity" onchange="draftField('city',this.value)" aria-invalid="${!!errors.city}">${options([['','اختر المدينة'],['الرياض','الرياض'],['جدة','جدة'],['الدمام','الدمام']],d.city)}</select>${errorText('city')}</div></div><div class="field ${errors.price?'invalid':''}"><label for="adprice">السعر بالريال</label><input id="adprice" type="number" min="1" value="${esc(d.price)}" placeholder="2500" oninput="draftField('price',this.value)" aria-invalid="${!!errors.price}">${errorText('price')}</div><div class="field ${errors.description?'invalid':''}"><label for="addesc">الوصف</label><textarea id="addesc" placeholder="اذكر الحالة والمواصفات" oninput="draftField('description',this.value)">${esc(d.description)}</textarea>${errorText('description')}</div>`}
function photoFields(){let d=state.draft;return `<div class="field ${errors.city?'invalid':''}"><label for="adcity">المدينة</label><select id="adcity" onchange="draftField('city',this.value)">${options([['','اختر المدينة'],['الرياض','الرياض'],['جدة','جدة'],['الدمام','الدمام']],d.city)}</select>${errorText('city')}</div><label class="field-label" for="photos">صور الإعلان</label><div class="upload-box"><div>${icon('laptop')} إضافة صور</div><input id="photos" type="file" accept="image/*" multiple onchange="readPhotos(this.files)"><p class="small">الصور تبقى داخل المتصفح ولا يتم رفعها.</p><button class="demo-photo quiet" type="button" onclick="samplePhotos()">استخدام صور تجريبية</button></div>${errorText('photos')}<div class="photo-previews">${d.photos.map(p=>`<img src="${esc(p)}" alt="معاينة صورة الإعلان">`).join('')}</div>`}
function samplePhotos(){state.draft.photos=['assets/dell-side.jpg','assets/dell-open.jpg'];state.reviewed=false;errors={};render()}
function readPhotos(files){let valid=[...files].filter(f=>f.type.startsWith('image/')).slice(0,4);if(!valid.length){errors.photos='اختر صورة صالحة.';render();return}Promise.all(valid.map(f=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)}))).then(a=>{state.draft.photos=a;state.reviewed=false;errors={};render()})}
function validate(){let d=pullDraft();errors={};if(!d.title.trim())errors.title='يرجى إدخال عنوان الإعلان';if(!d.price||+d.price<=0)errors.price='يرجى إدخال سعر أكبر من صفر';if(!d.description.trim())errors.description='يرجى كتابة وصف الإعلان';if(!d.city)errors.city='يرجى اختيار المدينة';return !Object.keys(errors).length}
function nextStep(){if(state.step===1){if(!validate()){render();return}state.step=2;render();return}if(state.step===2){pullDraft();errors={};if(!state.draft.city)errors.city='يرجى اختيار المدينة';if(!state.draft.photos.length)errors.photos='أضف صورة أو استخدم الصور التجريبية';if(Object.keys(errors).length){render();return}state.step=3;state.reviewed=true;render()}}
function saveDraft(){pullDraft();feedback='تم حفظ المسودة داخل جلسة المتصفح الحالية.';render()}
function publish(){if(!state.reviewed){errors.review='أكمل الخطوات وراجع الإعلان أولًا.';render();return}state.published=true;feedback='تم تأكيد النشر التجريبي فقط؛ لم يُنشر شيء في حراج الحقيقي.';render()}
function creation(){let d=state.draft;let preview=d.photos[0]||'assets/dell.jpg';return `<h2 class="create-title">إضافة إعلان جديد</h2><div id="feedback">${toast()}</div><div class="creation"><section class="entry-panel"><h3>١. إدخال البيانات</h3><ol class="steps">${['بيانات الإعلان','الصور والموقع','المراجعة'].map((t,i)=>`<li class="${state.step===i+1?'active':''}" ${state.step===i+1?'aria-current="step"':''}><b>${i+1}</b>${t}</li>`).join('')}</ol>${state.step===1?detailsFields():state.step===2?photoFields():`<p>اكتملت البيانات. راجع الملخص ثم أكّد النشر التجريبي.</p><div class="photo-previews">${d.photos.map(p=>`<img src="${esc(p)}" alt="معاينة صورة الإعلان">`).join('')}</div>`}<div class="form-buttons"><button class="primary" ${state.step===3?'disabled':''} onclick="nextStep()">${state.step===2?'مراجعة الإعلان':'التالي'}</button><button class="quiet" onclick="saveDraft()">حفظ المسودة</button><button class="quiet" onclick="pullDraft();state.step=Math.max(1,state.step-1);errors={};render()" ${state.step===1?'disabled':''}>السابق</button></div></section><section class="review-panel"><h3>٢. المراجعة بعد تصحيح البيانات</h3><div class="review-product"><div><h3>${esc(d.title||'عنوان الإعلان')}</h3><div class="price">${esc(d.price||'—')} ر.س</div><p>${esc(d.city||'المدينة غير محددة')}</p><p>${esc(d.description||'سيظهر وصف الإعلان هنا بعد إدخاله.')}</p></div><img src="${esc(preview)}" alt="معاينة الإعلان"></div><div class="review-actions"><button class="green" onclick="publish()">نشر الإعلان</button><button class="quiet" onclick="pullDraft();state.step=1;state.reviewed=false;errors={};render()">تعديل</button></div>${errorText('review')}<p class="hint">${state.reviewed?'تمت المراجعة. يمكنك تأكيد النشر التجريبي.':'أكمل البيانات والصور ثم اضغط مراجعة الإعلان قبل النشر.'}</p>${state.published?`<div class="publish-success" role="status"><div class="success-check">✓</div><h3>تم تأكيد إعلانك التجريبي بنجاح</h3><p>لم يتم نشر أي شيء على حراج الحقيقي.</p><button class="primary" onclick="go('posted')">عرض الإعلان</button></div>`:''}</section></div>`}
function posted(){let d=state.draft;return `<section class="message-panel"><h2>${esc(d.title)}</h2><p class="small">إعلان تجريبي — محفوظ داخل الجلسة فقط</p><div class="review-product"><div><div class="price">${esc(d.price)} ر.س</div><p>${esc(d.category)} — ${esc(d.city)}</p><p>${esc(d.description)}</p></div><img src="${esc(d.photos[0]||'assets/dell.jpg')}" alt="صورة الإعلان التجريبي"></div><div class="photo-previews">${d.photos.map(p=>`<img src="${esc(p)}" alt="صورة مضافة للإعلان">`).join('')}</div><button class="primary" onclick="state.step=1;state.reviewed=false;go('create')">تعديل الإعلان</button><button onclick="go('home')">العودة للرئيسية</button></section>`}
function render(){let html=state.page==='home'?home():state.page==='results'?results():state.page==='detail'?details():state.page==='saved'?saved():state.page==='contact'?contact():state.page==='messages'?messages():state.page==='posted'?posted():creation();$('view').innerHTML=html;let nav=$('nav-home');if(nav)nav.className=state.page==='home'?'current':'';}
render();
</script></body></html>
